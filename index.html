<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      max-width: 600px;
    }

    form {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: grid;
      gap: 0.3rem;
    }

    .color-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .color-field input[type="color"] {
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 1px solid #999;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-field input[type="text"] {
      flex: 1;
    }

    .color-preview {
      width: 2rem;
      height: 2rem;
      border: 1px solid #999;
      border-radius: 4px;
      flex-shrink: 0;
    }

    input,
    button {
      font-size: 1rem;
      padding: 0.5rem;
    }

    #qrCanvas {
      border: 1px solid #ddd;
      display: none;
      image-rendering: pixelated;
    }

    #error {
      color: #b00020;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <form id="qrForm">
    <label for="textInput">
      Text to encode
      <input id="textInput" type="text" placeholder="https://example.com or any text" required>
    </label>

    <label for="resolutionInput">
      Output resolution (px)
      <input id="resolutionInput" type="number" min="64" max="2048" value="512" required>
    </label>

    <label for="foregroundHex">
      Foreground color
      <div class="color-field">
        <input id="foregroundPicker" type="color" value="#000000">
        <input id="foregroundHex" type="text" value="#000000FF" pattern="^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$" required>
        <div id="foregroundPreview" class="color-preview"></div>
      </div>
    </label>

    <label for="backgroundHex">
      Background color
      <div class="color-field">
        <input id="backgroundPicker" type="color" value="#ffffff">
        <input id="backgroundHex" type="text" value="#FFFFFFFF" pattern="^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$" required>
        <div id="backgroundPreview" class="color-preview"></div>
      </div>
    </label>

    <button type="submit">Generate</button>
  </form>

  <p id="error" aria-live="polite"></p>
  <canvas id="qrCanvas" aria-label="Generated QR code"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    const form = document.getElementById('qrForm');
    const textInput = document.getElementById('textInput');
    const resolutionInput = document.getElementById('resolutionInput');
    const foregroundPicker = document.getElementById('foregroundPicker');
    const foregroundHex = document.getElementById('foregroundHex');
    const backgroundPicker = document.getElementById('backgroundPicker');
    const backgroundHex = document.getElementById('backgroundHex');
    const foregroundPreview = document.getElementById('foregroundPreview');
    const backgroundPreview = document.getElementById('backgroundPreview');
    const canvas = document.getElementById('qrCanvas');
    const error = document.getElementById('error');

    // Convert #RRGGBBAA hex to an rgba() CSS string
    function hexToRgba(hex) {
      const clean = hex.replace('#', '');
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      const a = clean.length === 8 ? parseInt(clean.substring(6, 8), 16) / 255 : 1;
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function updatePreviews() {
      foregroundPreview.style.backgroundColor = hexToRgba(foregroundHex.value);
      backgroundPreview.style.backgroundColor = hexToRgba(backgroundHex.value);
    }

    // Sync: picker -> hex (preserves existing alpha suffix)
    foregroundPicker.addEventListener('input', () => {
      const alpha = foregroundHex.value.length === 9 ? foregroundHex.value.slice(7) : 'FF';
      foregroundHex.value = foregroundPicker.value.toUpperCase() + alpha;
      updatePreviews();
    });
    backgroundPicker.addEventListener('input', () => {
      const alpha = backgroundHex.value.length === 9 ? backgroundHex.value.slice(7) : 'FF';
      backgroundHex.value = backgroundPicker.value.toUpperCase() + alpha;
      updatePreviews();
    });

    // Sync: hex -> picker (picker only supports 6-char hex)
    foregroundHex.addEventListener('input', () => {
      if (/^#[0-9A-Fa-f]{6}/.test(foregroundHex.value)) {
        foregroundPicker.value = foregroundHex.value.slice(0, 7);
      }
      updatePreviews();
    });
    backgroundHex.addEventListener('input', () => {
      if (/^#[0-9A-Fa-f]{6}/.test(backgroundHex.value)) {
        backgroundPicker.value = backgroundHex.value.slice(0, 7);
      }
      updatePreviews();
    });

    updatePreviews();

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      error.textContent = '';

      const text = textInput.value.trim();
      const resolution = Number.parseInt(resolutionInput.value, 10);

      if (!text) {
        error.textContent = 'Please enter some text.';
        canvas.style.display = 'none';
        return;
      }

      if (!Number.isFinite(resolution) || resolution < 64 || resolution > 2048) {
        error.textContent = 'Resolution must be between 64 and 2048.';
        canvas.style.display = 'none';
        return;
      }

      const fgValid = /^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$/.test(foregroundHex.value);
      const bgValid = /^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$/.test(backgroundHex.value);
      if (!fgValid || !bgValid) {
        error.textContent = 'Colors must be hex format: #RRGGBB or #RRGGBBAA.';
        canvas.style.display = 'none';
        return;
      }

      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();

      const moduleCount = qr.getModuleCount();
      const cellSize = resolution / moduleCount;

      canvas.width = resolution;
      canvas.height = resolution;
      const context = canvas.getContext('2d');

      context.clearRect(0, 0, resolution, resolution);
      context.fillStyle = hexToRgba(backgroundHex.value);
      context.fillRect(0, 0, resolution, resolution);
      context.fillStyle = hexToRgba(foregroundHex.value);

      for (let row = 0; row < moduleCount; row += 1) {
        for (let col = 0; col < moduleCount; col += 1) {
          if (!qr.isDark(row, col)) {
            continue;
          }

          const x = Math.round(col * cellSize);
          const y = Math.round(row * cellSize);
          const width = Math.round((col + 1) * cellSize) - x;
          const height = Math.round((row + 1) * cellSize) - y;

          context.fillRect(x, y, width, height);
        }
      }

      canvas.style.display = 'block';
    });
  </script>
</body>
</html>
